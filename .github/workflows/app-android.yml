# Fábrica de la app Android del técnico (Suite Cottech).
# Va en el repositorio de GitHub Pages, en:  .github/workflows/app-android.yml
#
# Se ejecuta sola cuando cambias tecnico.html, Icono.png o la carpeta app_nativa,
# o a mano desde la pestaña Actions → "Crear app Android" → Run workflow.
# Resultado: una "Release" con el archivo CottechTecnico.apk, que es lo que descarga app.html.
name: Crear app Android

on:
  workflow_dispatch:
  push:
    paths:
      - "tecnico.html"
      - "Icono.png"
      - "app_nativa/**"
      - ".github/workflows/app-android.yml"

permissions:
  contents: write

concurrency:
  group: app-android
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Los secretos solo se entregan a los 2 pasos que los usan (no a npm ni a Gradle).
      - name: Revisar la llave de firma
        env:
          FIRMA_BASE64: ${{ secrets.COTTECH_FIRMA_BASE64 }}
          FIRMA_CLAVE: ${{ secrets.COTTECH_FIRMA_CLAVE }}
        run: |
          if [ -z "$FIRMA_BASE64" ] || [ -z "$FIRMA_CLAVE" ]; then
            echo "::error::Faltan los secretos COTTECH_FIRMA_BASE64 y COTTECH_FIRMA_CLAVE. Agrégalos en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar Capacitor y el GPS en segundo plano
        working-directory: app_nativa
        run: npm install --no-audit --no-fund

      - name: Preparar el proyecto Android
        working-directory: app_nativa
        env:
          APP_REPO: ${{ github.repository }}
        run: node preparar.mjs ../tecnico.html

      - name: Poner el ícono de la empresa
        if: hashFiles('Icono.png') != ''
        run: |
          python3 -m pip install --quiet pillow
          python3 app_nativa/iconos.py Icono.png app_nativa/android/app/src/main/res

      - name: Compilar
        working-directory: app_nativa/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Firmar
        env:
          FIRMA_BASE64: ${{ secrets.COTTECH_FIRMA_BASE64 }}
          FIRMA_CLAVE: ${{ secrets.COTTECH_FIRMA_CLAVE }}
        run: |
          echo "$FIRMA_BASE64" | base64 -d > "$RUNNER_TEMP/firma.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SIN_FIRMA=$(ls app_nativa/android/app/build/outputs/apk/release/*.apk | head -1)
          if [ -z "$SIN_FIRMA" ]; then echo "::error::No se generó el APK"; exit 1; fi
          "$BT/zipalign" -p -f 4 "$SIN_FIRMA" "$RUNNER_TEMP/alineado.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/firma.jks" --ks-key-alias cottech \
            --ks-pass env:FIRMA_CLAVE --key-pass env:FIRMA_CLAVE \
            --out CottechTecnico.apk "$RUNNER_TEMP/alineado.apk"
          "$BT/apksigner" verify --print-certs CottechTecnico.apk
          rm -f "$RUNNER_TEMP/firma.jks"

      - name: Publicar la versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODIGO=$(sed -n 1p app_nativa/version_app.txt)
          NOMBRE=$(sed -n 2p app_nativa/version_app.txt)
          gh release create "app-$CODIGO" CottechTecnico.apk \
            --title "App Técnico $NOMBRE" \
            --notes "Versión $NOMBRE de la app del técnico. Se descarga desde app.html." \
            --latest
          # Se guardan solo las 5 versiones más recientes de la app
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("app-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r VIEJA; do
            gh release delete "$VIEJA" --yes --cleanup-tag
          done
