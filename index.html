<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evaluación de Calidad del Servicio</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      margin: 0; padding: 18px; background: #0f172a; color: #f8fafc;
      display: flex; justify-content: center;
    }
    .card {
      width: 100%; max-width: 470px; background: #1e293b;
      border: 1px solid #334155; border-radius: 14px; padding: 22px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .badge {
      display: inline-block; background: #0f172a; color: #38bdf8;
      border: 1px solid #1e40af; padding: 5px 10px; border-radius: 8px;
      font-size: 12px; font-weight: 600; margin-bottom: 10px;
    }
    h1 { font-size: 19px; margin: 0 0 4px 0; color: #ffffff; }
    .sub { font-size: 13px; color: #94a3b8; margin-bottom: 18px; }
    .bloque-pregunta {
      background: #0f172a; border: 1px solid #334155;
      border-radius: 10px; padding: 14px; margin-bottom: 14px;
    }
    .titulo-p { font-size: 14px; font-weight: 700; color: #f8fafc; margin: 0 0 4px 0; }
    .explicacion-p { font-size: 12px; color: #94a3b8; margin: 0 0 12px 0; line-height: 1.35; }

    .estrellas { display: flex; justify-content: space-between; gap: 6px; }
    .btn-star {
      flex: 1; padding: 10px 0; font-size: 17px; font-weight: bold;
      background: #1e293b; color: #64748b; border: 1px solid #334155;
      border-radius: 8px; cursor: pointer; transition: 0.15s;
    }
    .btn-star.activo { background: #f59e0b; color: #0f172a; border-color: #fbbf24; }

    .fila-sino { display: flex; gap: 10px; }
    .btn-sino {
      flex: 1; padding: 10px; font-size: 14px; font-weight: bold;
      background: #1e293b; color: #cbd5e1; border: 1px solid #334155;
      border-radius: 8px; cursor: pointer;
    }
    .btn-sino.activo-si { background: #10b981; color: #0f172a; border-color: #34d399; }
    .btn-sino.activo-no { background: #ef4444; color: #ffffff; border-color: #f87171; }

    .grid-nps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .btn-nps {
      padding: 9px 0; font-size: 13px; font-weight: bold;
      background: #1e293b; color: #cbd5e1; border: 1px solid #334155;
      border-radius: 6px; cursor: pointer;
    }
    .btn-nps.activo { background: #38bdf8; color: #0f172a; border-color: #7dd3fc; }

    select, textarea, input[type="text"] {
      width: 100%; background: #1e293b; color: #ffffff;
      border: 1px solid #475569; border-radius: 8px; padding: 10px;
      font-size: 13px;
    }
    .input-otro { margin-top: 10px; border-color: #f59e0b !important; }
    .oculto { display: none; }
    .btn-enviar {
      width: 100%; padding: 13px; font-size: 15px; font-weight: bold;
      background: #2563eb; color: white; border: none; border-radius: 10px;
      cursor: pointer; margin-top: 6px;
    }
    .btn-enviar:disabled { background: #475569; cursor: not-allowed; }
    .mensaje-final { text-align: center; padding: 20px 10px; }
  </style>
</head>
<body>

<div class="card" id="contenedor-encuesta">
  <div class="badge" id="badge-info">Cargando datos...</div>
  <h1 id="titulo-empresa">Evaluación de Servicio</h1>
  <div class="sub" id="sub-encuesta">Responda estas preguntas breves. Toma menos de 30 segundos.</div>

  <div id="contenedor-preguntas"></div>

  <button type="button" class="btn-enviar" id="btn-submit" onclick="enviarEvaluacion()">Enviar Evaluación ✔</button>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const tecnico = (params.get("tec") || "").trim().toUpperCase();
  const ot = (params.get("ot") || "").trim();
  const ts = params.get("ts") || "";
  const sig = params.get("sig") || "";
  let emp = params.get("emp") || "Mi Empresa";
  let rol = params.get("rol") || "Empleado";
  let tx = params.get("tx") || "Servicio";
  const apiKeyId = params.get("k") || "";

  const urlWebhook = apiKeyId.startsWith("http")
    ? apiKeyId
    : `https://script.google.com/macros/s/${apiKeyId}/exec`;

  // Encuesta por defecto si aún no se ha personalizado en la nube
  const ENCUESTA_POR_DEFECTO = [
    {
      id: "CSAT",
      titulo: "¿Qué tan satisfecho está con la atención del {rol}?",
      explicacion: "Evalúe únicamente el desempeño de la persona que le atendió hoy (1 = Muy bajo, 5 = Excelente).",
      tipo: "ESTRELLAS_5",
      opciones: ""
    },
    {
      id: "CAUSA",
      titulo: "¿Cuál fue el aspecto principal por mejorar?",
      explicacion: "Seleccione el motivo principal o elija 'Otros' para escribir su situación.",
      tipo: "OPCIONES_OTRO",
      opciones: "Puntualidad, Limpieza del área, Trato del personal, Funcionamiento del servicio, Claridad de la información"
    },
    {
      id: "RESUELTO",
      titulo: "¿El servicio solicitado quedó funcionando?",
      explicacion: "Indique si su solicitud quedó completada al finalizar la atención.",
      tipo: "SINO",
      opciones: ""
    },
    {
      id: "NPS",
      titulo: "¿Recomendaría a {empresa} a otra persona?",
      explicacion: "Califique su confianza en la empresa de 0 (Nada probable) a 10 (Totalmente probable).",
      tipo: "ESCALA_10",
      opciones: ""
    },
    {
      id: "COMENTARIO",
      titulo: "Comentario adicional (Opcional)",
      explicacion: "Si desea agregar una observación puntual, escríbala aquí.",
      tipo: "TEXTO",
      opciones: ""
    }
  ];

  let preguntasActivas = JSON.parse(JSON.stringify(ENCUESTA_POR_DEFECTO));
  let respuestasUsuario = {};

  function actualizarEncabezado() {
    document.getElementById("titulo-empresa").innerText = "Evaluación · " + emp;
    document.getElementById("badge-info").innerText = `${rol}: ${tecnico || "N/A"}  |  ${tx} #${ot || "N/A"}`;
  }

  function reemplazarVariables(texto) {
    return String(texto || "")
      .replace(/\{rol\}/gi, rol)
      .replace(/\{empresa\}/gi, emp)
      .replace(/\{tx\}/gi, tx);
  }

  function construirFormulario() {
    actualizarEncabezado();
    const cont = document.getElementById("contenedor-preguntas");
    cont.innerHTML = "";
    respuestasUsuario = {};

    let numVisible = 1;
    preguntasActivas.forEach((p, idx) => {
      const clave = p.id || ("P_" + idx);
      const esCausaCondicional = (clave === "CAUSA");

      const div = document.createElement("div");
      div.className = "bloque-pregunta" + (esCausaCondicional ? " oculto" : "");
      div.id = "bloque-" + clave;

      const prefijoNum = esCausaCondicional ? "↳ " : (numVisible++ + ". ");
      const tituloLimpio = reemplazarVariables(p.titulo);
      const expLimpia = reemplazarVariables(p.explicacion);

      let htmlControl = "";

      if (p.tipo === "ESTRELLAS_5") {
        htmlControl = `<div class="estrellas" id="ctrl-${clave}">`;
        for (let s = 1; s <= 5; s++) {
          htmlControl += `<button type="button" class="btn-star" onclick="elegirEstrella('${clave}', ${s})">${s} ★</button>`;
        }
        htmlControl += `</div>`;
      } else if (p.tipo === "ESCALA_10") {
        htmlControl = `<div class="grid-nps" id="ctrl-${clave}">`;
        for (let n = 0; n <= 10; n++) {
          htmlControl += `<button type="button" class="btn-nps" onclick="elegirEscala10('${clave}', ${n}, this)">${n}</button>`;
        }
        htmlControl += `</div>`;
      } else if (p.tipo === "SINO") {
        htmlControl = `
          <div class="fila-sino" id="ctrl-${clave}">
            <button type="button" class="btn-sino" id="si-${clave}" onclick="elegirSiNo('${clave}', 'Sí')">Sí</button>
            <button type="button" class="btn-sino" id="no-${clave}" onclick="elegirSiNo('${clave}', 'No')">No</button>
          </div>`;
      } else if (p.tipo === "OPCIONES" || p.tipo === "OPCIONES_OTRO") {
        const listaOp = String(p.opciones || "").split(",").map(x => x.trim()).filter(Boolean);
        htmlControl = `<select id="sel-${clave}" onchange="elegirOpcion('${clave}', '${p.tipo}')">
          <option value="">-- Seleccione una opción --</option>`;
        listaOp.forEach(op => {
          htmlControl += `<option value="${op}">${op}</option>`;
        });
        if (p.tipo === "OPCIONES_OTRO") {
          htmlControl += `<option value="OTRO">Otros / Sugerencia (Especificar motivo)</option>`;
        }
        htmlControl += `</select>`;
        if (p.tipo === "OPCIONES_OTRO") {
          htmlControl += `<input type="text" id="otro-${clave}" class="input-otro oculto" maxlength="130" placeholder="Escriba aquí su motivo o sugerencia..." oninput="actualizarTextoOtro('${clave}')" />`;
        }
      } else {
        htmlControl = `<textarea id="txt-${clave}" rows="2" placeholder="Escriba aquí su respuesta..." oninput="respuestasUsuario['${clave}'] = this.value.trim()"></textarea>`;
      }

      div.innerHTML = `
        <p class="titulo-p">${prefijoNum}${tituloLimpio}</p>
        <p class="explicacion-p">${expLimpia}</p>
        ${htmlControl}
      `;
      cont.appendChild(div);

      if (clave === "RESUELTO" && p.tipo === "SINO") {
        elegirSiNo("RESUELTO", "Sí");
      }
    });
  }

  window.elegirEstrella = function(clave, valor) {
    respuestasUsuario[clave] = valor;
    const grupo = document.getElementById("ctrl-" + clave);
    if (grupo) {
      grupo.querySelectorAll(".btn-star").forEach((b, idx) => b.classList.toggle("activo", idx + 1 <= valor));
    }
    if (clave === "CSAT") {
      const bloqueCausa = document.getElementById("bloque-CAUSA");
      if (bloqueCausa) {
        if (valor <= 3) {
          bloqueCausa.classList.remove("oculto");
        } else {
          bloqueCausa.classList.add("oculto");
          respuestasUsuario["CAUSA"] = "Ninguna (Atención Óptima)";
        }
      }
    }
  };

  window.elegirEscala10 = function(clave, valor, btn) {
    respuestasUsuario[clave] = valor;
    const grupo = document.getElementById("ctrl-" + clave);
    if (grupo) {
      grupo.querySelectorAll(".btn-nps").forEach(b => b.classList.remove("activo"));
    }
    btn.classList.add("activo");
  };

  window.elegirSiNo = function(clave, valor) {
    respuestasUsuario[clave] = valor;
    const bSi = document.getElementById("si-" + clave);
    const bNo = document.getElementById("no-" + clave);
    if (bSi) bSi.classList.toggle("activo-si", valor === "Sí");
    if (bNo) bNo.classList.toggle("activo-no", valor === "No");
  };

  window.elegirOpcion = function(clave, tipo) {
    const sel = document.getElementById("sel-" + clave);
    const inpOtro = document.getElementById("otro-" + clave);
    if (!sel) return;
    if (sel.value === "OTRO" && inpOtro) {
      inpOtro.classList.remove("oculto");
      inpOtro.focus();
      respuestasUsuario[clave] = inpOtro.value.trim() ? ("Otros: " + inpOtro.value.trim()) : "";
    } else {
      if (inpOtro) {
        inpOtro.classList.add("oculto");
        inpOtro.value = "";
      }
      respuestasUsuario[clave] = sel.value;
    }
  };

  window.actualizarTextoOtro = function(clave) {
    const inpOtro = document.getElementById("otro-" + clave);
    if (inpOtro) {
      const txt = inpOtro.value.trim();
      respuestasUsuario[clave] = txt ? ("Otros: " + txt) : "";
    }
  };

  // Dibujar de inmediato y luego sincronizar con las preguntas personalizadas del encargado
  construirFormulario();
  if (apiKeyId) {
    fetch(urlWebhook + "?accion=CONFIG")
      .then(r => r.json())
      .then(cfg => {
        if (cfg && Array.isArray(cfg.encuesta) && cfg.encuesta.length > 0) {
          preguntasActivas = cfg.encuesta;
          if (cfg.empresa) emp = cfg.empresa;
          if (cfg.rolSingular) rol = cfg.rolSingular;
          if (cfg.txCorto) tx = cfg.txCorto;
          construirFormulario();
        }
      })
      .catch(() => {});
  }

  async function enviarEvaluacion() {
    let csatVal = 5;
    let npsVal = 10;
    let causaVal = "Ninguna (Atención Óptima)";
    let resueltoVal = "Sí";
    let comentarioVal = "";
    let extrasLista = [];

    for (let i = 0; i < preguntasActivas.length; i++) {
      const p = preguntasActivas[i];
      const clave = p.id || ("P_" + i);
      const bloque = document.getElementById("bloque-" + clave);
      if (bloque && bloque.classList.contains("oculto")) continue;

      const resp = respuestasUsuario[clave];
      const esOpcional = (clave === "COMENTARIO" || p.tipo === "TEXTO" && p.titulo.toLowerCase().includes("opcional"));

      if (!esOpcional && (resp === undefined || resp === null || resp === "")) {
        return alert(`Por favor responda la pregunta: "${reemplazarVariables(p.titulo)}"`);
      }

      if (clave === "CSAT") {
        csatVal = Number(resp) || 5;
      } else if (clave === "CAUSA") {
        causaVal = String(resp || "Ninguna (Atención Óptima)");
      } else if (clave === "RESUELTO") {
        resueltoVal = String(resp || "Sí");
      } else if (clave === "NPS") {
        npsVal = (resp !== undefined && resp !== "") ? Number(resp) : 10;
      } else if (clave === "COMENTARIO") {
        comentarioVal = String(resp || "");
      } else if (resp !== undefined && resp !== "") {
        const valFormateado = (p.tipo === "ESTRELLAS_5") ? `${resp} ★` : resp;
        extrasLista.push(`${reemplazarVariables(p.titulo)}: ${valFormateado}`);
      }
    }

    if (!apiKeyId) return alert("Este enlace QR no contiene la dirección del servidor.");

    let clientId = localStorage.getItem("calidad_client_uid");
    if (!clientId) {
      clientId = "CLI-" + Math.random().toString(36).substring(2, 10).toUpperCase() + "-" + Date.now().toString(36).toUpperCase();
      localStorage.setItem("calidad_client_uid", clientId);
    }

    const btn = document.getElementById("btn-submit");
    btn.disabled = true;
    btn.innerText = "Enviando respuesta...";

    const payload = {
      accion: "REGISTRAR_ENCUESTA",
      tecnico: tecnico,
      ot: ot,
      ts: Number(ts),
      sig: sig,
      csat: csatVal,
      nps: npsVal,
      causaRaiz: causaVal,
      navegando: resueltoVal,
      respuestaExtra: extrasLista.length > 0 ? extrasLista.join(" | ") : "N/A",
      comentario: comentarioVal,
      fingerprint: clientId
    };

    try {
      const resp = await fetch(urlWebhook, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      const resJson = await resp.json();
      if (resJson.status === "success") {
        document.getElementById("contenedor-encuesta").innerHTML = `
          <div class="mensaje-final">
            <h1 style="color:#4ade80;font-size:22px;">¡Muchas gracias!</h1>
            <p style="color:#cbd5e1;font-size:14px;">${resJson.message}</p>
          </div>`;
      } else {
        alert("Aviso: " + resJson.message);
        btn.disabled = false;
        btn.innerText = "Enviar Evaluación ✔";
      }
    } catch (err) {
      alert("Error de conexión al enviar la encuesta.");
      btn.disabled = false;
      btn.innerText = "Enviar Evaluación ✔";
    }
  }
</script>
</body>
</html>
